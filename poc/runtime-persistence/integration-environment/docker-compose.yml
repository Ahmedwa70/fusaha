name: fusaha-runtime-persistence-poc

services:
  postgres:
    image: postgres:16-alpine
    container_name: fusaha-runtime-poc-postgres
    restart: "no"
    environment:
      POSTGRES_DB: ${POC_POSTGRES_DB:?Set POC_POSTGRES_DB in .env.integration}
      POSTGRES_USER: ${POC_POSTGRES_USER:?Set POC_POSTGRES_USER in .env.integration}
      POSTGRES_PASSWORD: ${POC_POSTGRES_PASSWORD:?Set POC_POSTGRES_PASSWORD in .env.integration}
    ports:
      - "127.0.0.1:${POC_POSTGRES_PORT:-55432}:5432"
    volumes:
      - fusaha_runtime_poc_pgdata:/var/lib/postgresql/data
      - ./postgres/init-db.sql:/docker-entrypoint-initdb.d/001-init-db.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 2s
      timeout: 3s
      retries: 20
    networks:
      - fusaha_runtime_poc

  minio:
    image: minio/minio:latest
    container_name: fusaha-runtime-poc-minio
    restart: "no"
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${POC_MINIO_ROOT_USER:?Set POC_MINIO_ROOT_USER in .env.integration}
      MINIO_ROOT_PASSWORD: ${POC_MINIO_ROOT_PASSWORD:?Set POC_MINIO_ROOT_PASSWORD in .env.integration}
    ports:
      - "127.0.0.1:${POC_MINIO_API_PORT:-59000}:9000"
      - "127.0.0.1:${POC_MINIO_CONSOLE_PORT:-59001}:9001"
    volumes:
      - fusaha_runtime_poc_miniodata:/data
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 2s
      timeout: 3s
      retries: 20
    networks:
      - fusaha_runtime_poc

  minio-init:
    image: minio/mc:latest
    container_name: fusaha-runtime-poc-minio-init
    restart: "no"
    depends_on:
      minio:
        condition: service_healthy
    environment:
      POC_MINIO_ROOT_USER: ${POC_MINIO_ROOT_USER:?Set POC_MINIO_ROOT_USER in .env.integration}
      POC_MINIO_ROOT_PASSWORD: ${POC_MINIO_ROOT_PASSWORD:?Set POC_MINIO_ROOT_PASSWORD in .env.integration}
      POC_MINIO_BUCKET: ${POC_MINIO_BUCKET:-runtime-poc-private}
    volumes:
      - ./minio/init-minio.sh:/init-minio.sh:ro
    entrypoint: ["/bin/sh", "/init-minio.sh"]
    networks:
      - fusaha_runtime_poc

volumes:
  fusaha_runtime_poc_pgdata:
    name: fusaha-runtime-poc-pgdata
  fusaha_runtime_poc_miniodata:
    name: fusaha-runtime-poc-miniodata

networks:
  fusaha_runtime_poc:
    name: fusaha-runtime-poc-network
    internal: true
